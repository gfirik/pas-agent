name: Release

# Push a tag like `v0.1.0` to build binaries for every platform and attach them to a
# GitHub release.
on:
  push:
    tags: ['v*']
  # Dry run from a branch: builds and smoke-tests every target, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

  build:
    needs: verify
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pas-agent-cli

      # Every target runs natively on its runner (the Intel macOS build runs under Rosetta),
      # so run the exact binary that will be published instead of trusting that it works.
      - name: Smoke test
        shell: bash
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/pas-agent"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          "$bin" init --task "smoke test"
          echo hello > a.txt
          "$bin" checkpoint "first"
          echo changed >> a.txt
          "$bin" status | grep -q "since the last checkpoint"
          "$bin" export --to codex
          grep -q "Changed Since Last Checkpoint" AGENTS.md

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="pas-agent-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/pas-agent" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pas-agent-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pas-agent.exe", README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
          "ASSET=$name.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
