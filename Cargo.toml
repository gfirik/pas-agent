[workspace]
resolver = "2"
members = [
    "crates/pas-agent-core",
    "crates/pas-agent-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gfirik/pas-agent"
homepage = "https://gfirik.github.io/pas-agent/"
keywords = ["ai", "agents", "claude", "codex", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
pas-agent-core = { path = "crates/pas-agent-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
